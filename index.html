<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ストーリーズメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>ストーリーズメーカー</h1></header>
<main>
 <div id="work">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="bar">
   <button class="sub" id="pick">写真を選ぶ</button><button class="sub" id="del">削除</button><button class="sub" id="reset">初期化</button><span></span>
   <button class="gold" id="share">共有</button><button id="save">保存</button>
  </div>
 </div>
 <section id="panel">
  <nav id="modes"><button class="mode" data-m="template">テンプレート</button><button class="mode" data-m="stamp">スタンプ</button><button class="mode" data-m="text">文字</button></nav>
  <nav id="tabs"></nav>
  <div id="items"></div>
 </section>
</main>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="app.js"></script>
</body></html>
